<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Assistant — Cybrox Store</title>
    <meta
      name="description"
      content="Local business management: inventory, orders, customers, messaging and analytics."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">📦</span>
          <span class="logo-text">BizAssist</span>
        </div>
        <button
          class="sidebar-close"
          id="sidebarClose"
          aria-label="Close sidebar"
        >
          ✕
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="#dashboard" class="nav-item active" data-section="dashboard">
          <span class="nav-icon">📊</span
          ><span class="nav-label">Dashboard</span>
        </a>
        <a href="#inventory" class="nav-item" data-section="inventory">
          <span class="nav-icon">🗄️</span
          ><span class="nav-label">Inventory</span>
        </a>
        <a href="#sales" class="nav-item" data-section="sales">
          <span class="nav-icon">🧾</span><span class="nav-label">Sales</span>
        </a>
        <a href="#orders" class="nav-item" data-section="orders">
          <span class="nav-icon">🛒</span><span class="nav-label">Orders</span>
        </a>
        <a href="#customers" class="nav-item" data-section="customers">
          <span class="nav-icon">👥</span
          ><span class="nav-label">Customers</span>
        </a>
        <a href="#messaging" class="nav-item" data-section="messaging">
          <span class="nav-icon">💬</span
          ><span class="nav-label">Messaging</span>
        </a>
        <a href="#analytics" class="nav-item" data-section="analytics">
          <span class="nav-icon">📈</span
          ><span class="nav-label">Analytics</span>
        </a>
        <a href="#assistant" class="nav-item" data-section="assistant">
          <span class="nav-icon">✦</span
          ><span class="nav-label">Business Assistant</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
          <span id="themeIcon">🌙</span> <span id="themeLabel">Dark Mode</span>
        </button>
      </div>
    </aside>

    <!-- Main layout -->
    <div class="layout" id="layout">
      <!-- Top header -->
      <header class="topbar">
        <button class="hamburger" id="hamburger" aria-label="Open sidebar">
          ☰
        </button>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-right">
          <span class="demo-badge">🧪 DEMO MODE</span>
          <span class="business-name" id="businessName">Cybrox Store</span>
        </div>
      </header>

      <!-- Page content -->
      <main class="main-content" id="app-content">
        <div class="loading-spinner-wrap"><div class="spinner"></div></div>
      </main>
    </div>

    <!-- Modal overlay -->
    <div
      class="modal-overlay hidden"
      id="modal-overlay"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal" id="modal">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-title">Dialog</h2>
          <button class="modal-close" id="modal-close" aria-label="Close">
            ✕
          </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-footer" id="modal-footer"></div>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" aria-live="polite"></div>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/charts.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/inventory.js"></script>
    <script src="/js/sales.js"></script>
    <script src="/js/orders.js"></script>
    <script src="/js/customers.js"></script>
    <script src="/js/messaging.js"></script>
    <script src="/js/analytics.js"></script>
    <script src="/js/assistant.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
